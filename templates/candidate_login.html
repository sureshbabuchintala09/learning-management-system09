
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Login | LMS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }
        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,.1);
        }
        h1 { text-align: center; color: #1e293b; margin-top: 0; }
        .subtitle { text-align: center; color: #64748b; }
        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
            color: #334155;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .message {
            padding: 10px;
            margin-top: 12px;
            border-radius: 6px;
        }
        .success { background: #dcfce7; color: #166534; }
        .danger, .error { background: #fee2e2; color: #991b1b; }
        .links {
            margin-top: 20px;
            text-align: center;
            line-height: 1.8;
        }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <main class="login-box">
        <h1>Candidate Login</h1>
        <p class="subtitle">Continue your learning journey</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('candidate_login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   autocomplete="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   autocomplete="current-password" required>

            <button type="submit">Login</button>
        </form>

        <div class="links">
            <a href="{{ url_for('register') }}">New candidate? Register here</a>
            <br>
            <a href="{{ url_for('login') }}">Admin Login</a>
        </div>
    </main>
</body>
</html>
