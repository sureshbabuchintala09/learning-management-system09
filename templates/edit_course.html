
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course | LMS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }
        .container {
            max-width: 650px;
            margin: 30px auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }
        h1 { margin-top: 0; }
        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }
        textarea { min-height: 130px; resize: vertical; }
        button, .back {
            display: inline-block;
            margin-top: 18px;
            padding: 11px 16px;
            border: 0;
            border-radius: 6px;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
        }
        button { background: #2563eb; color: white; }
        .back { background: #e2e8f0; color: #1e293b; }
        .message { padding: 12px; margin-bottom: 12px; border-radius: 6px; }
        .success { background: #dcfce7; color: #166534; }
        .error, .danger { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Edit Course</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('edit_course', course_id=course.id) }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label for="course_name">Course Name</label>
            <input
                type="text"
                id="course_name"
                name="course_name"
                value="{{ course.course_name }}"
                maxlength="200"
                required
            >

            <label for="description">Course Description</label>
            <textarea id="description" name="description">{{ course.description or '' }}</textarea>

            <button type="submit">Save Changes</button>
            <a class="back" href="{{ url_for('admin_dashboard') }}">Cancel</a>
        </form>
    </main>
</body>
</html>
